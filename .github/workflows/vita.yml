# The PS Vita homebrew: a .vpk for installation (docs/vita.md). Runs on every push, on pull requests and by hand
# (Actions > Vita > Run workflow). The .vpk is in the run's artifacts as vitaWW. No game data is used or needed
# here: the player adds their own copy of the game under ux0:/data/vitaWW on the device.
name: Vita

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vita:
    name: Vita homebrew (.vpk)
    runs-on: ubuntu-latest
    env:
      # a workspace-local install so the VitaSDK scripts need no sudo; configure_host.py reads $VITASDK
      VITASDK: ${{ github.workspace }}/vitasdk
      SDL_TAG: release-2.32.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build imagemagick cmake pngquant

      # The VitaSDK (arm-vita-eabi toolchain + SDL2 built for Vita) is cached by key. SDL2 is installed into the
      # toolchain prefix ($VITASDK/arm-vita-eabi), where configure_host.py and arm-vita-eabi-pkg-config find it.
      - name: Cache VitaSDK
        id: vitasdk
        uses: actions/cache@v4
        with:
          path: ${{ env.VITASDK }}
          key: vitasdk-${{ runner.os }}-${{ env.SDL_TAG }}-vgl5shark-v2

      # bootstrap-vitasdk.sh installs the toolchain (vitasdk-core: arm-vita-eabi-gcc, the Sce stubs, the CMake
      # toolchain file). We do NOT run install-all.sh - its pacman-based bulk install is brittle on the runner, and
      # we only need SDL2, which we build from source below (as the iOS workflow builds SDL2 for iOS).
      - name: VitaSDK toolchain
        if: steps.vitasdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          test -x "$VITASDK/bin/arm-vita-eabi-gcc"
          test -f "$VITASDK/share/vita.toolchain.cmake"

      - name: Build SDL2 for Vita
        if: steps.vitasdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git build/SDL2-src
          cmake -S build/SDL2-src -B build/SDL2-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi"
          cmake --build build/SDL2-build
          cmake --install build/SDL2-build
          test -f "$VITASDK/arm-vita-eabi/include/SDL2/SDL.h"

      # vitaGL (OpenGL-ES-over-GXM) and its shader-compiler chain. vitaGL compiles its pipeline shaders at runtime
      # via vitaShaRK (shark_*), which loads the on-device Cg compiler libshacccg.suprx; vitaShaRK needs
      # SceShaccCgExt, which needs taiHEN's header to load that module. We build the whole chain into the toolchain
      # prefix. At runtime the device needs libshacccg.suprx installed for the GPU path - if it's absent the app
      # falls back to the software renderer (modern/host/vita/vita_gl.c checks for it).
      - name: Build vitaGL stack for Vita
        if: steps.vitasdk.outputs.cache-hit != 'true'
        run: |
          export PATH="$VITASDK/bin:$PATH"
          # math-neon: NEON libm (math_neon.h + libmathneon.a). vitaGL includes it; the app links -lmathneon.
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon.git build/mathneon-src
          make -C build/mathneon-src -j"$(nproc)" install
          test -f "$VITASDK/arm-vita-eabi/include/math_neon.h"
          test -f "$VITASDK/arm-vita-eabi/lib/libmathneon.a"
          # taiHEN header: SceShaccCgExt includes <taihen.h> to load libshacccg.suprx. Core SDK ships the stub lib
          # (-ltaihen_stub) but not the header, so install it from the taiHEN repo.
          git clone --depth 1 https://github.com/yifanlu/taiHEN.git build/taihen-src
          cp build/taihen-src/taihen.h "$VITASDK/arm-vita-eabi/include/taihen.h"
          test -f "$VITASDK/arm-vita-eabi/include/taihen.h"
          # SceShaccCgExt -> shacccg_ext.h (needed to compile vitaShaRK). -std=gnu17: its taiHEN TAI_CONTINUE macro
          # casts through an empty-parens function pointer type (type(*)()), which the toolchain's modern GCC reads
          # as (void) and then rejects the call's arguments; gnu17 keeps the K&R "unspecified args" meaning.
          git clone --depth 1 https://github.com/bythos14/SceShaccCgExt.git build/shacccgext-src
          cmake -S build/shacccgext-src -B build/shacccgext-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_C_FLAGS="-std=gnu17" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi"
          cmake --build build/shacccgext-build
          cmake --install build/shacccgext-build
          test -f "$VITASDK/arm-vita-eabi/include/shacccg_ext.h"
          # vitaShaRK -> vitashark.h + libvitashark (vitaGL hard-includes/links it)
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK.git build/vitashark-src
          make -C build/vitashark-src -j"$(nproc)" install
          test -f "$VITASDK/arm-vita-eabi/include/vitashark.h"
          # vitaGL itself (NO_DEBUG strips its logging)
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL.git build/vitaGL-src
          make -C build/vitaGL-src -j"$(nproc)" NO_DEBUG=1 install
          test -f "$VITASDK/arm-vita-eabi/lib/libvitaGL.a"
          test -f "$VITASDK/arm-vita-eabi/include/vitaGL.h"

      # Persist the (expensive) SDK + shader-compiler build immediately, so a later app-build/link failure doesn't
      # force the whole ~20-minute toolchain rebuild on the next run. No-op on a cache hit.
      - name: Save VitaSDK cache
        if: success() && steps.vitasdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VITASDK }}
          key: vitasdk-${{ runner.os }}-${{ env.SDL_TAG }}-vgl5shark-v2

      # The user-mode taiHEN stub (libtaihen_stub.a) that SceShaccCgExt links against isn't part of the
      # vdpm-bootstrapped core toolchain, so generate it from taiHEN's NID database (exports.yml) with
      # vita-libs-gen. Cheap (~seconds), so it runs every build - including cache hits, where the cached SDK does
      # not contain it - rather than being baked into the (heavy) cache.
      - name: Ensure taiHEN user stub
        run: |
          export PATH="$VITASDK/bin:$PATH"
          if [ ! -f "$VITASDK/arm-vita-eabi/lib/libtaihen_stub.a" ]; then
            git clone --depth 1 https://github.com/yifanlu/taiHEN.git build/taihen-stub-src
            # taiHEN's exports.yml is the vita-libs-gen-2 schema (top-level module name); the old vita-libs-gen
            # rejects it. vita-libs-gen-2 is what the toolchain's vita_create_stubs() uses.
            vita-libs-gen-2 build/taihen-stub-src/exports.yml build/taihen-stubgen
            make -C build/taihen-stubgen
            find build/taihen-stubgen -name 'libtaihen_stub*.a' -exec cp {} "$VITASDK/arm-vita-eabi/lib/" \;
          fi
          test -f "$VITASDK/arm-vita-eabi/lib/libtaihen_stub.a"

      - name: PATH
        run: echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Build stamp
        run: echo "#define VITA_BUILD \"${GITHUB_SHA::7}\"" > modern/host/vita/build_id.h

      - name: Configure
        run: python3 tools/configure_host.py --os vita

      - name: Build
        run: ninja -f build_host_vita.ninja

      - name: Check the program
        run: file build/hostvita_usa/acww

      - name: SceLibm / imports diagnostic
        run: |
          echo "=== pkg-config sdl2 libs ==="; arm-vita-eabi-pkg-config --libs sdl2 || true
          echo "=== SceLib strings in ELF ==="; arm-vita-eabi-strings build/hostvita_usa/acww 2>/dev/null | grep -i "SceLib" | sort -u || strings build/hostvita_usa/acww | grep -i SceLib | sort -u
          echo "=== vita-elf-create verbose (imported modules/NIDs) ==="; vita-elf-create -v -n build/hostvita_usa/acww /tmp/diag.velf 2>&1 | grep -iE "libm|module|import|resolv|NID|0x" | head -80 || true
          echo "=== which objects reference libm math (sqrt/sin/pow) ==="; arm-vita-eabi-nm build/hostvita_usa/acww 2>/dev/null | grep -iE " (sqrt|sqrtf|sin|cos|pow|__aeabi_)" | head -30

      - name: Symbol map (for mapping crash/diagnostic return addresses)
        run: |
          arm-vita-eabi-nm -n --defined-only build/hostvita_usa/acww > build/vita-symbols.txt
          echo "symbol count: $(wc -l < build/vita-symbols.txt)"
          # print the text symbols so they're in the build log and greppable by address
          awk 'toupper($2)=="T"' build/vita-symbols.txt

      - name: ELF layout (diagnostics)
        run: |
          echo "=== ELF header ==="; arm-vita-eabi-readelf -h build/hostvita_usa/acww
          echo "=== program headers (segments) ==="; arm-vita-eabi-readelf -l build/hostvita_usa/acww
          echo "=== sections ==="; arm-vita-eabi-readelf -S -W build/hostvita_usa/acww
          echo "=== vita-elf-create help ==="; vita-elf-create 2>&1 | head -40 || true

      - name: LiveArea assets (placeholder icon if none committed, then pngquant)
        run: |
          icon=modern/host/vita/sce_sys/icon0.png
          if [ ! -f "$icon" ]; then
            convert -size 128x128 xc:'#3a7d3a' -gravity center -pointsize 34 -fill white \
              -annotate 0 'vWW' "$icon"
          fi
          # the Vita installer rejects LiveArea PNGs that were not quantized with pngquant (install error 0x8010113D)
          find modern/host/vita/sce_sys -name '*.png' -print -exec pngquant --force --ext .png 256 {} \;

      - name: Package
        run: |
          python3 tools/vita_package.py build/hostvita_usa/acww build/vita/vitaWW.vpk
          ls -l build/vita/vitaWW.vpk
          unzip -l build/vita/vitaWW.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: vitaWW
          path: build/vita/vitaWW.vpk
          if-no-files-found: error
